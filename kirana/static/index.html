<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirana</title>
<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--ink:#1f2a24;--muted:#6b756e;--line:#e4ddcf;--accent:#1f6b4a;--accent-ink:#fff;--user:#1f6b4a;--warn:#9a5b00;--bad:#a33a2a}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--panel:#1c2420;--ink:#e9efe9;--muted:#93a097;--line:#2b3731;--accent:#5fbf8f;--accent-ink:#0d1a13;--user:#2c6e4f;--warn:#e0a54a;--bad:#e07a68}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-size:1.15rem;letter-spacing:.2px}
header span{color:var(--muted);font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
.msg{margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap}
.me{align-items:flex-end}.me .bubble{background:var(--user);color:#fff;border-bottom-right-radius:4px}
.bot{align-items:flex-start}.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.note{font-size:.82rem;color:var(--muted);max-width:88%}
.cart{width:min(100%,560px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cart h3{margin:0;padding:10px 13px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.line{padding:10px 13px;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line .t{display:flex;justify-content:space-between;gap:10px}
.line .n{font-weight:600}
.line .p{white-space:nowrap;color:var(--muted)}
.line .r{font-size:.82rem;color:var(--muted);margin-top:2px}
.line .r.warn{color:var(--warn)}
.line a{font-size:.82rem;color:var(--accent)}
.foot{padding:10px 13px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.foot .tot{margin-right:auto;font-weight:600}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.status{font-size:.82rem;color:var(--muted)}
.status.ok{color:var(--accent)}.status.bad{color:var(--bad)}
form{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
input{flex:1;font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:.85rem;padding:5px 10px;border-radius:99px}
</style>
</head>
<body>
<header><h1>Kirana</h1><span>Ask for anything. I use what you usually buy. Nothing is bought until you approve.</span></header>
<div id="log" aria-live="polite"></div>
<form id="f" autocomplete="off">
  <input id="q" placeholder="e.g. coffee and pistachios, or &quot;what's due?&quot;" aria-label="Message" autofocus>
  <button class="pri" id="send">Send</button>
</form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),f=document.getElementById('f');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function scroll(){log.scrollTop=log.scrollHeight}
function say(who,text){const m=el('div','msg '+who);m.appendChild(el('div','bubble',text));log.appendChild(m);scroll();return m}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'error');return j}
function money(p){return p?'$'+p.toFixed(2):'price unknown'}
function renderCart(c,host){
  host.replaceChildren();
  const h=el('h3');h.append(el('span',null,c.store+' · cart '+c.id),el('span',null,c.status.replace('_',' ')));host.appendChild(h);
  c.lines.forEach(l=>{const d=el('div','line'),t=el('div','t');
    t.append(el('span','n',l.qty+' × '+l.short),el('span','p',money(l.price)));d.appendChild(t);
    const nohist=l.reason.startsWith('no history');
    d.appendChild(el('div','r'+(nohist?' warn':''),l.reason));
    if(l.link){const a=el('a',null,'Open in '+c.store+' ↗');a.href=l.link;a.target='_blank';a.rel='noopener';d.appendChild(a)}
    host.appendChild(d)});
  const foot=el('div','foot');foot.appendChild(el('span','tot',c.total));
  const st=el('span','status');
  if(c.status==='proposed'){
    const ok=el('button','pri','Approve cart'),no=el('button',null,'Cancel');
    ok.onclick=()=>act('approve',c,host,ok,no,st);no.onclick=()=>act('cancel',c,host,ok,no,st);
    foot.append(st,no,ok);
  }else if(c.status==='handed_off'){
    st.textContent='Approved. Open each item, add it to your cart, then check out yourself.';
    const done=el('button','pri','I checked out');done.onclick=()=>act('complete',c,host,done,done,st);
    foot.append(st,done);
  }else{st.textContent=c.status==='placed'?'Recorded as bought.':c.status;foot.append(st)}
  host.appendChild(foot);
}
async function act(a,c,host,b1,b2,st){
  b1.disabled=b2.disabled=true;
  try{const j=await post('/api/action',{action:a,id:c.id});renderCart(j.cart,host)}
  catch(e){st.textContent=e.message;st.className='status bad';b1.disabled=b2.disabled=false}
}
async function send(text){
  say('me',text);const wait=say('bot','…');
  try{
    const j=await post('/api/chat',{message:text});wait.remove();
    const m=say('bot',j.reply);
    (j.carts||[]).forEach(c=>{const h=el('div','cart');renderCart(c,h);m.appendChild(h)});
    (j.notes||[]).forEach(n=>m.appendChild(el('div','note',n)));scroll();
  }catch(e){wait.remove();say('bot','Sorry, that failed: '+e.message)}
}
f.onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';send(t)};
const hi=say('bot','Hi! Tell me what you need and I will pick your usual product and build a cart. Try:');
const chips=el('div','chips');
['coffee and pistachios',"what's due?",'band-aids'].forEach(t=>{const b=el('button',null,t);b.type='button';b.onclick=()=>send(t);chips.appendChild(b)});
hi.appendChild(chips);
</script>
</body>
</html>
